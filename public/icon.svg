<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="50%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="80%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.5" />

  <!-- Outer Star / Shield / Magen Accent -->
  <g transform="translate(256, 260) scale(0.95)" filter="url(#glow)">
    <!-- Open Book / Siddur Base -->
    <path d="M-140,80 C-70,60 -20,85 0,110 C20,85 70,60 140,80 L140,160 C70,140 20,165 0,190 C-20,165 -70,140 -140,160 Z" fill="#ffffff" fill-opacity="0.95" />
    <path d="M-140,80 C-70,60 -20,85 0,110 L0,190 C-20,165 -70,140 -140,160 Z" fill="#fef3c7" />
    
    <!-- Siddur Spine & Line Accents -->
    <path d="M0,110 L0,190" stroke="#b45309" stroke-width="4" />
    <path d="M-115,108 C-65,95 -25,112 -12,128" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round" />
    <path d="M-115,128 C-65,115 -25,132 -12,148" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round" />
    <path d="M115,108 C65,95 25,112 12,128" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round" />
    <path d="M115,128 C65,115 25,132 12,148" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round" />

    <!-- Memorial Flame (Ner Tamid / Yurzaid Flame) -->
    <path d="M0,60 C-35,30 -50,-20 -20,-75 C-15,-85 -5,-100 0,-130 C5,-100 15,-85 20,-75 C50,-20 35,30 0,60 Z" fill="url(#flameGrad)" />
    <!-- Inner Flame Core -->
    <path d="M0,45 C-18,25 -25,-10 -10,-45 C-7,-52 -2,-60 0,-80 C2,-60 7,-52 10,-45 C25,-10 18,25 0,45 Z" fill="#ffffff" opacity="0.9" />

    <!-- Star of David / Magen David Subtle Watermark -->
    <polygon points="0,-165 45,-90 -45,-90" fill="none" stroke="#fef3c7" stroke-width="3" stroke-opacity="0.4" />
    <polygon points="0,-65 45,-140 -45,-140" fill="none" stroke="#fef3c7" stroke-width="3" stroke-opacity="0.4" />
  </g>

  <!-- Hebrew Inscription Arc -->
  <text x="256" y="85" text-anchor="middle" font-family="serif" font-weight="bold" font-size="34" fill="#fef3c7" letter-spacing="4">קַדִּישׁ וְיָארְצַייט</text>
  <!-- App Title Latin -->
  <text x="256" y="475" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="22" fill="#fde68a" letter-spacing="3">KADISH Y YURZAID</text>
</svg>
